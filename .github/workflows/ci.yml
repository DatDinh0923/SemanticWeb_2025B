name: Validate knowledge graph

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: make pipeline PYTHON=python PIP=pip
      - run: git diff --exit-code -- data/processed data/rdf
