services:
  fuseki:
    image: stain/jena-fuseki:5.1.0
    ports:
      - "127.0.0.1:3030:3030"
    environment:
      ADMIN_PASSWORD: "${FUSEKI_ADMIN_PASSWORD:-admin}"
      FUSEKI_DATASET_1: football
      TDB: "2"
    volumes:
      - fuseki-data:/fuseki
    restart: unless-stopped

volumes:
  fuseki-data:
